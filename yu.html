<script type="text/plain" id="app-source">
/* ============================================================================
   SALA 2 — EL TALLER DEL COLOR (Pigmento Añil)
   "La Galería en Blanco" · Eonesia v15.1 · Pantalla independiente
   ---------------------------------------------------------------------------
   Cumple 1bis (accesibilidad/legibilidad) desde el diseño, no como parche:
   - Cuerpo >=18px/1.6; rótulos de consola >=22px/600; títulos de pantalla
     28-36px; dato numérico crítico (proximidad cromática) >=24px, y el más
     decisivo (validación final) aún mayor.
   - Contraste AA verificado a mano (fórmula WCAG) para cada acento CMY sobre
     el fondo oscuro; ninguno es el único portador de significado — cada dial
     lleva su etiqueta de texto (CIAN/MAGENTA/AMARILLO), no solo color.
   - Foco de teclado visible en todo interactivo; cada dial es además un
     control accesible real: role="slider" + flechas de teclado + botones
     +/- de 64x64px como alternativa al arrastre fino (complementa, no
     sustituye, el gesto circular).
   - Ningún destello por encima de 3Hz: el "acierto" es un pulso ÚNICO
     (no repetido), nunca una animación estroboscópica.
   - Tema de alto contraste opcional (toggle en cabecera).
   ---------------------------------------------------------------------------
   NOTA: esta pantalla no usa fragmentos de obra (el guion de P4 no los
   contempla — es una sala de mezcla cromática con diales, no de clasificación
   de fragmentos), así que no aplica aquí el requisito de imágenes reales con
   crédito; no se han añadido de relleno.
   ========================================================================= */

const { useState, useRef, useEffect, useCallback, useMemo } = React;

/* ---------------------------------------------------------------------- */
/* 0. DATOS: textos de sistema, encargos, hints                           */
/* ---------------------------------------------------------------------- */

const SYS_TITLE = 'SALA 2 — EL TALLER DEL COLOR';
const SYS_INTRO = 'Pigmento AÑIL drenado. Calibrad los diales para reproducir los tonos exigidos por el taller.';
const DOSSIER_TEXT = 'El color pigmentario se comporta distinto a la luz: aquí mezclamos sustractivamente. Cian + Magenta + Amarillo en proporciones iguales tienden a un gris oscuro, no al blanco.';

const HINTS = {
  igualIntensidad: 'La proporción entre diales importa más que subirlos todos a la vez. Comparad el resultado tras cada ajuste.',
  noRevisaPanel: 'Mirad el panel central después de cada ajuste, no solo el dial que estáis moviendo.',
  complementarioPuro: 'El complementario del naranja no está en un solo dial. Es una combinación de los otros dos primarios.',
  proporcionRelativa: 'La proporción es relativa entre los tres diales, no el valor absoluto de cada uno. Comparad cuánto más alto está uno respecto a los otros dos.',
  masAfinar: 'Estáis cerca, pero el margen de tolerancia técnica exige más precisión. Seguid afinando.',
};

function cmyToRgb(c, m, y) {
  return { r: 255 * (1 - c / 100), g: 255 * (1 - m / 100), b: 255 * (1 - y / 100) };
}
function rgbCss({ r, g, b }) { return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`; }
function rgbDistance(a, b) { return Math.sqrt((a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2); }
function proximityPct(a, b) {
  const d = rgbDistance(a, b);
  const pct = 100 - (d / 441.7) * 100;
  return Math.max(0, Math.min(100, Math.round(pct)));
}

const ENCARGOS = [
  {
    idx: 1,
    texto: 'Encargo 1 de 3 — Reproducid un verde de restauración estándar.',
    target: { r: 71, g: 235, b: 89 },
    umbral: 85,
    referencia: null,
  },
  {
    idx: 2,
    texto: 'Encargo 2 de 3 — Reproducid el complementario exacto de este naranja de referencia.',
    target: { r: 25, g: 145, b: 235 },
    umbral: 90,
    referencia: { color: { r: 230, g: 110, b: 20 }, label: 'Naranja de referencia' },
  },
  {
    idx: 3,
    texto: 'Encargo 3 de 3 — Reproducid esta mezcla de restauración: 60% Cian, 30% Magenta, 10% Amarillo.',
    target: cmyToRgb(60, 30, 10),
    umbral: 95,
    referencia: null,
  },
];

/* ---------------------------------------------------------------------- */
/* 1. UTILIDADES: estado por URL, motion, geometría, audio                */
/* ---------------------------------------------------------------------- */

function encodeState(obj) { try { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); } catch (e) { return ''; } }
function decodeState(str) { try { return JSON.parse(decodeURIComponent(escape(atob(str)))); } catch (e) { return null; } }
function readInitialState() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('state');
  const fallback = { equipo: 'Equipo sin asignar', registros_p3: null, anomalia_p3: false, registros_p4: {}, ayudas_usadas: 0 };
  if (!raw) return fallback;
  const decoded = decodeState(raw);
  if (!decoded) return fallback;
  return { ...fallback, ...decoded };
}

const REDUCE_MOTION = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR = { bar: REDUCE_MOTION ? 1 : 200, wheel: REDUCE_MOTION ? 1 : 200 };

function polarToCartesian(cx, cy, r, angleDeg) {
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}
function donutSectorPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  if (endAngle <= startAngle) return '';
  const p1 = polarToCartesian(cx, cy, rOuter, endAngle);
  const p2 = polarToCartesian(cx, cy, rOuter, startAngle);
  const p3 = polarToCartesian(cx, cy, rInner, startAngle);
  const p4 = polarToCartesian(cx, cy, rInner, endAngle);
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 ${largeArc} 0 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 ${largeArc} 1 ${p4.x} ${p4.y} Z`;
}
function angleFromPointer(cx, cy, px, py) {
  const dx = px - cx, dy = py - cy;
  let deg = Math.atan2(dx, -dy) * 180 / Math.PI; // 0deg = arriba, positivo = horario
  return deg;
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function useAudio(muted) {
  const ctxRef = useRef(null);
  const ensureCtx = useCallback(() => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctxRef.current = new AC();
    }
    if (ctxRef.current && ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  }, []);
  const playTone = useCallback((freqStart, freqEnd, durMs, type) => {
    if (muted) return;
    const ctx = ensureCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = type;
    const t0 = ctx.currentTime;
    osc.frequency.setValueAtTime(freqStart, t0);
    if (freqEnd !== freqStart) osc.frequency.linearRampToValueAtTime(freqEnd, t0 + durMs / 1000);
    gain.gain.setValueAtTime(0.16, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs / 1000);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + durMs / 1000 + 0.03);
  }, [muted, ensureCtx]);
  const playCorrect = useCallback(() => playTone(440, 660, 120, 'sine'), [playTone]);
  const playIncorrect = useCallback(() => playTone(180, 180, 200, 'square'), [playTone]);

  const startGlissando = useCallback(() => {
    if (muted) return null;
    const ctx = ensureCtx();
    if (!ctx) return null;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.07, ctx.currentTime + 0.05);
    osc.frequency.setValueAtTime(200, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    return { osc, gain, ctx };
  }, [muted, ensureCtx]);
  const updateGlissando = useCallback((handle, value) => {
    if (!handle) return;
    const freq = 200 + clamp(value, 0, 100) / 100 * 400;
    handle.osc.frequency.setTargetAtTime(freq, handle.ctx.currentTime, 0.01);
  }, []);
  const stopGlissando = useCallback((handle) => {
    if (!handle) return;
    try {
      handle.gain.gain.cancelScheduledValues(handle.ctx.currentTime);
      handle.gain.gain.setValueAtTime(handle.gain.gain.value, handle.ctx.currentTime);
      handle.gain.gain.linearRampToValueAtTime(0.0001, handle.ctx.currentTime + 0.08);
      setTimeout(() => { try { handle.osc.stop(); } catch (e) {} }, 140);
    } catch (e) {}
  }, []);

  return { playCorrect, playIncorrect, startGlissando, updateGlissando, stopGlissando };
}

function onKeyActivate(fn) {
  return e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); fn(); } };
}

/* ---------------------------------------------------------------------- */
/* 2. COMPONENTES DE PRESENTACIÓN                                         */
/* ---------------------------------------------------------------------- */

function ConsoleHeader({ muted, onToggleMute, highContrast, onToggleContrast, equipo }) {
  return React.createElement('div', { className: 'flex flex-wrap items-center justify-between gap-3 px-4 sm:px-6 py-3 border-b hairline bg-[var(--bg-panel)]/90 backdrop-blur sticky top-0 z-40' },
    React.createElement('div', { className: 'flex items-center gap-3 flex-wrap' },
      React.createElement('span', { className: 'mono t-body font-semibold text-[var(--ocre)] border border-[var(--ocre-dim)] px-2 py-1' }, 'EONESIA v15.1'),
      React.createElement('h1', { className: 'mono t-label text-[var(--text-main)]' }, SYS_TITLE),
    ),
    React.createElement('div', { className: 'flex items-center gap-3 flex-wrap' },
      React.createElement('span', { className: 'mono t-body text-[var(--text-dim)] hidden sm:inline' }, equipo),
      React.createElement('button', { onClick: onToggleContrast, className: 'mono t-body px-3 py-2 border hairline scanline-btn', 'aria-pressed': highContrast }, highContrast ? '◐ contraste alto: ON' : '◐ alto contraste'),
      React.createElement('button', { onClick: onToggleMute, className: 'mono t-body px-3 py-2 border hairline scanline-btn', 'aria-pressed': muted, 'aria-label': muted ? 'Activar sonido' : 'Silenciar sonido' }, muted ? '🔇 sonido' : '🔊 sonido')
    )
  );
}

function PhaseTracker({ phase }) {
  const steps = [{ n: 1, label: 'Identificar' }, { n: 2, label: 'Aplicar' }, { n: 3, label: 'Criterio' }];
  return React.createElement('div', { className: 'flex items-center gap-3 flex-wrap mono t-label text-[var(--text-dim)] px-4 sm:px-6 py-3 border-b hairline' },
    steps.map((s, i) => React.createElement(React.Fragment, { key: s.n },
      React.createElement('span', { className: 'px-2 py-1 border ' + (phase === s.n ? 'text-[var(--gold)] border-[var(--gold)]/70 bg-[var(--gold)]/10' : 'border-transparent') }, `FASE ${s.n} · ${s.label}`),
      i < steps.length - 1 ? React.createElement('span', { className: 'text-[var(--text-dim)]', 'aria-hidden': 'true' }, '—') : null
    ))
  );
}

function HintBar({ text, onDismiss }) {
  if (!text) return null;
  return React.createElement('div', { className: 'fixed bottom-4 left-4 right-4 sm:right-auto sm:max-w-lg z-40', role: 'status' },
    React.createElement('div', { className: 'bg-[var(--bg-panel-2)] border border-[var(--ocre-dim)] px-4 py-3 flex items-start gap-3 shadow-lg' },
      React.createElement('span', { 'aria-hidden': 'true', className: 't-label' }, '💡'),
      React.createElement('p', { className: 'mono t-body text-[var(--text-main)] flex-1' }, text),
      React.createElement('button', { onClick: onDismiss, className: 'mono t-body px-2 text-[var(--text-dim)] hover:text-[var(--text-main)]', 'aria-label': 'Cerrar pista' }, '✕')
    )
  );
}

/* ---- Rueda de color exploratoria (Fase 1, y modal de referencia) ---- */
function ColorWheel({ selected, onSelect, size }) {
  const s = size || 320;
  const cx = s / 2, cy = s / 2, rOuter = s / 2 - 6, rInner = s * 0.32;
  const sectors = Array.from({ length: 12 }, (_, i) => i);
  return React.createElement('svg', { viewBox: `0 0 ${s} ${s}`, width: s, height: s, role: 'group', 'aria-label': 'Rueda de color de 12 sectores' },
    sectors.map(i => {
      const hue = i * 30;
      const isSel = selected === i;
      const isComp = selected !== null && (selected + 6) % 12 === i;
      const sat = (isSel || isComp) ? 100 : 78;
      const light = 50;
      const strokeW = (isSel || isComp) ? 4 : 1;
      const d = donutSectorPath(cx, cy, rOuter, rInner, i * 30, i * 30 + 30);
      return React.createElement('path', {
        key: i, d,
        fill: `hsl(${hue}, ${sat}%, ${light}%)`,
        stroke: (isSel || isComp) ? 'var(--gold)' : 'rgba(255,255,255,0.25)',
        strokeWidth: strokeW,
        style: { transition: `fill ${DUR.wheel}ms ease, stroke-width ${DUR.wheel}ms ease` },
        tabIndex: 0, role: 'button',
        'aria-label': `Sector de tono ${hue} grados. Pulsa para resaltar su complementario.`,
        onClick: () => onSelect(isSel ? null : i),
        onKeyDown: onKeyActivate(() => onSelect(isSel ? null : i)),
        className: 'cursor-pointer',
      });
    })
  );
}

function rgbToApproxCmy({ r, g, b }) {
  return { c: Math.round((1 - r / 255) * 100), m: Math.round((1 - g / 255) * 100), y: Math.round((1 - b / 255) * 100) };
}
function hueToRgb(hueDeg) {
  // HSL(hue,78%,50%) aproximado a RGB para el texto de proporción CMY
  const h = hueDeg / 60;
  const c = 0.78 * (1 - Math.abs(2 * 0.5 - 1));
  const x = c * (1 - Math.abs(h % 2 - 1));
  let r1, g1, b1;
  if (h < 1) { r1 = c; g1 = x; b1 = 0; } else if (h < 2) { r1 = x; g1 = c; b1 = 0; }
  else if (h < 3) { r1 = 0; g1 = c; b1 = x; } else if (h < 4) { r1 = 0; g1 = x; b1 = c; }
  else if (h < 5) { r1 = x; g1 = 0; b1 = c; } else { r1 = c; g1 = 0; b1 = x; }
  const m = 0.5 - c / 2;
  return { r: (r1 + m) * 255, g: (g1 + m) * 255, b: (b1 + m) * 255 };
}

function WheelExplorer() {
  const [selected, setSelected] = useState(null);
  const selRgb = selected !== null ? hueToRgb(selected * 30) : null;
  const compRgb = selected !== null ? hueToRgb(((selected + 6) % 12) * 30) : null;
  const selCmy = selRgb ? rgbToApproxCmy(selRgb) : null;
  return React.createElement('div', { className: 'flex flex-col md:flex-row gap-8 items-center' },
    React.createElement(ColorWheel, { selected, onSelect: setSelected, size: 300 }),
    React.createElement('div', { className: 'flex-1 w-full' },
      React.createElement('p', { className: 't-body text-[var(--text-dim)] mb-5' }, DOSSIER_TEXT),
      selected === null
        ? React.createElement('p', { className: 't-body text-[var(--text-dim)]' }, 'Tocad cualquier sector para resaltar su complementario y ver su proporción CMY aproximada.')
        : React.createElement('div', { className: 'flex flex-col gap-4' },
            React.createElement('div', { className: 'flex items-center gap-4' },
              React.createElement('div', { className: 'w-16 h-16 border-2 hairline flex-shrink-0', style: { background: rgbCss(selRgb) } }),
              React.createElement('div', null,
                React.createElement('p', { className: 'mono t-body font-semibold text-[var(--text-main)]' }, 'Color seleccionado'),
                React.createElement('p', { className: 't-body text-[var(--text-dim)]' }, `≈ Cian ${selCmy.c}% · Magenta ${selCmy.m}% · Amarillo ${selCmy.y}%`)
              )
            ),
            React.createElement('div', { className: 'flex items-center gap-4' },
              React.createElement('div', { className: 'w-16 h-16 border-2 hairline flex-shrink-0', style: { background: rgbCss(compRgb) } }),
              React.createElement('div', null,
                React.createElement('p', { className: 'mono t-body font-semibold text-[var(--text-main)]' }, 'Complementario'),
                React.createElement('p', { className: 't-body text-[var(--text-dim)]' }, 'Opuesto en la rueda — máximo contraste perceptual.')
              )
            )
          )
    )
  );
}

function WheelModal({ open, onClose }) {
  if (!open) return null;
  return React.createElement('div', { className: 'fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4', onClick: onClose },
    React.createElement('div', { className: 'bg-[var(--bg-panel)] border hairline max-w-2xl w-full p-6', onClick: e => e.stopPropagation(), role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Rueda de color de referencia' },
      React.createElement('div', { className: 'flex items-center justify-between mb-4' },
        React.createElement('h2', { className: 'mono t-label text-[var(--gold)]' }, 'RUEDA DE COLOR'),
        React.createElement('button', { onClick: onClose, className: 'mono t-body px-2 py-1 text-[var(--text-dim)] hover:text-[var(--text-main)]' }, '✕ cerrar')
      ),
      React.createElement(WheelExplorer, null)
    )
  );
}

/* ---- Dial CMY: arrastre circular + slider de teclado + botones +/- ---- */
function Dial({ label, colorVar, value, onChange, audio }) {
  const dialRef = useRef(null);
  const dragRef = useRef(null);
  const toneRef = useRef(null);
  const s = 168, cx = s / 2, cy = s / 2, rOuter = s / 2 - 4, rInner = s * 0.58;
  const angle = -135 + (value / 100) * 270;

  function commit(newVal) { onChange(clamp(Math.round(newVal), 0, 100)); }

  function onPointerDown(e) {
    const rect = dialRef.current.getBoundingClientRect();
    const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    dragRef.current = { center };
    toneRef.current = audio.startGlissando();
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp, { once: true });
    updateFromPointer(e.clientX, e.clientY);
  }
  function updateFromPointer(px, py) {
    const info = dragRef.current;
    if (!info) return;
    let deg = angleFromPointer(info.center.x, info.center.y, px, py);
    deg = clamp(deg, -135, 135);
    const v = ((deg + 135) / 270) * 100;
    commit(v);
    if (toneRef.current) audio.updateGlissando(toneRef.current, v);
  }
  const rafPendingRef = useRef(false);
  const lastPtRef = useRef(null);
  function onPointerMove(e) {
    lastPtRef.current = { x: e.clientX, y: e.clientY };
    if (rafPendingRef.current) return;
    rafPendingRef.current = true;
    requestAnimationFrame(() => {
      rafPendingRef.current = false;
      if (lastPtRef.current) updateFromPointer(lastPtRef.current.x, lastPtRef.current.y);
    });
  }
  function onPointerUp() {
    window.removeEventListener('pointermove', onPointerMove);
    audio.stopGlissando(toneRef.current);
    toneRef.current = null;
    dragRef.current = null;
  }

  function onKeyDown(e) {
    let delta = 0;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') delta = 1;
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') delta = -1;
    else if (e.key === 'PageUp') delta = 10;
    else if (e.key === 'PageDown') delta = -10;
    else if (e.key === 'Home') { e.preventDefault(); commit(0); return; }
    else if (e.key === 'End') { e.preventDefault(); commit(100); return; }
    else return;
    e.preventDefault();
    commit(value + delta);
  }

  const trackPath = donutSectorPath(cx, cy, rOuter, rInner, -135, 135);
  const fillPath = donutSectorPath(cx, cy, rOuter, rInner, -135, angle);

  return React.createElement('div', { className: 'flex items-center gap-3' },
    React.createElement('button', {
      className: 'w-16 h-16 flex-shrink-0 border hairline scanline-btn mono t-label',
      'aria-label': `Bajar ${label} en 1 por ciento`,
      onClick: () => commit(value - 1),
    }, '−'),
    React.createElement('div', { className: 'flex flex-col items-center gap-2' },
      React.createElement('div', {
        ref: dialRef,
        className: 'relative no-select cursor-grab active:cursor-grabbing',
        style: { width: s, height: s },
        onPointerDown,
        tabIndex: 0,
        role: 'slider',
        'aria-label': `Dial ${label}`,
        'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': value,
        'aria-valuetext': `${value} por ciento`,
        onKeyDown,
      },
        React.createElement('svg', { viewBox: `0 0 ${s} ${s}`, width: s, height: s },
          React.createElement('path', { d: trackPath, fill: 'rgba(255,255,255,0.08)' }),
          React.createElement('path', { d: fillPath || 'M0 0', fill: `var(${colorVar})`, opacity: 0.85 }),
          React.createElement('line', {
            x1: cx, y1: cy, x2: cx, y2: cy - rOuter + 6,
            stroke: 'var(--text-main)', strokeWidth: 3, strokeLinecap: 'round',
            transform: `rotate(${angle} ${cx} ${cy})`,
          }),
          React.createElement('circle', { cx, cy, r: rInner - 8, fill: 'var(--bg-panel)', stroke: `var(${colorVar})`, strokeWidth: 2 })
        )
      ),
      React.createElement('p', { className: 'mono t-label', style: { color: `var(${colorVar})` } }, label.toUpperCase()),
      React.createElement('p', { className: 'mono t-data text-[var(--text-main)]' }, `${value}%`)
    ),
    React.createElement('button', {
      className: 'w-16 h-16 flex-shrink-0 border hairline scanline-btn mono t-label',
      'aria-label': `Subir ${label} en 1 por ciento`,
      onClick: () => commit(value + 1),
    }, '+')
  );
}

/* ---- Panel de resultado: objetivo / referencia / resultado + proximidad ---- */
function ResultPanel({ encargo, resultRgb, proximidad }) {
  return React.createElement('div', { className: 'border hairline bg-[var(--bg-panel)] p-5' },
    React.createElement('div', { className: 'flex flex-wrap items-start gap-8 mb-5' },
      encargo.referencia && React.createElement('div', { className: 'flex flex-col items-center gap-2' },
        React.createElement('div', { className: 'w-24 h-24 border-2 hairline', style: { background: rgbCss(encargo.referencia.color) } }),
        React.createElement('p', { className: 't-body text-[var(--text-dim)] text-center' }, encargo.referencia.label)
      ),
      React.createElement('div', { className: 'flex flex-col items-center gap-2' },
        React.createElement('div', { className: 'w-24 h-24 border-2 hairline', style: { background: rgbCss(encargo.target) } }),
        React.createElement('p', { className: 't-body text-[var(--text-dim)] text-center' }, 'Objetivo')
      ),
      React.createElement('div', { className: 'flex flex-col items-center gap-2' },
        React.createElement('div', { className: 'w-24 h-24 border-2 hairline', style: { background: rgbCss(resultRgb), transition: `background ${DUR.bar}ms ease-out` } }),
        React.createElement('p', { className: 't-body text-[var(--text-dim)] text-center' }, 'Vuestra mezcla')
      ),
      React.createElement('div', { className: 'flex-1 min-w-[180px]' },
        React.createElement('p', { className: 'mono t-data-hero text-[var(--gold)]' }, `${proximidad}%`),
        React.createElement('p', { className: 't-body text-[var(--text-dim)] mb-2' }, `proximidad cromática · umbral ${encargo.umbral}%`),
        React.createElement('div', { className: 'h-4 bg-black/40 border hairline' },
          React.createElement('div', { className: 'h-full', style: { width: `${proximidad}%`, background: 'var(--gold)', transition: `width ${DUR.bar}ms ease-out` } })
        )
      )
    )
  );
}

/* ---------------------------------------------------------------------- */
/* 3. APP PRINCIPAL                                                       */
/* ---------------------------------------------------------------------- */

function App() {
  const initial = useMemo(readInitialState, []);
  const [equipo] = useState(initial.equipo);
  const [ayudasUsadas, setAyudasUsadas] = useState(initial.ayudas_usadas || 0);
  const [muted, setMuted] = useState(false);
  const [highContrast, setHighContrast] = useState(false);
  const audio = useAudio(muted);

  useEffect(() => { document.documentElement.classList.toggle('hc', highContrast); }, [highContrast]);

  const [introDone, setIntroDone] = useState(false);
  const [phase, setPhase] = useState(1);
  const [wheelModalOpen, setWheelModalOpen] = useState(false);
  const [hint, setHint] = useState(null);

  const [encargoIdx, setEncargoIdx] = useState(1); // 1,2,3
  const [dials, setDials] = useState({ c: 0, m: 0, y: 0 });
  const [commits, setCommits] = useState(0); // nº de giros/ajustes desde el último encargo
  const [iteraciones, setIteraciones] = useState({ 1: 0, 2: 0, 3: 0 });
  const [registrosP4, setRegistrosP4] = useState(initial.registros_p4 || {});
  const [passedNotice, setPassedNotice] = useState(null); // {idx, prox}
  const [allDone, setAllDone] = useState(false);

  function showHint(text) { setHint(text); setAyudasUsadas(a => a + 1); }

  const encargo = ENCARGOS[encargoIdx - 1];
  const resultRgb = cmyToRgb(dials.c, dials.m, dials.y);
  const proximidad = proximityPct(resultRgb, encargo.target);

  function updateDial(key, val) {
    setDials(prev => ({ ...prev, [key]: val }));
    setCommits(c => c + 1);
  }

  function chooseHintForFailure() {
    const vals = [dials.c, dials.m, dials.y];
    const max = Math.max(...vals), min = Math.min(...vals), avg = (dials.c + dials.m + dials.y) / 3;

    if (encargo.idx === 1) {
      const allEqual = (max - min) <= 8 && avg >= 45;
      if (allEqual) { showHint(HINTS.igualIntensidad); return; }
      if (commits < 3) { showHint(HINTS.noRevisaPanel); return; }
      showHint(HINTS.igualIntensidad);
      return;
    }
    if (encargo.idx === 2) {
      const sorted = vals.slice().sort((a, b) => b - a);
      const dominantSingle = (sorted[0] - sorted[1]) > 40;
      if (dominantSingle) { showHint(HINTS.complementarioPuro); return; }
      showHint(HINTS.masAfinar);
      return;
    }
    // encargo 3
    const yVsC = Math.abs(dials.y - dials.c);
    if (yVsC < 10) { showHint(HINTS.proporcionRelativa); return; }
    showHint(HINTS.masAfinar);
  }

  function onConfirmar() {
    setIteraciones(prev => ({ ...prev, [encargo.idx]: (prev[encargo.idx] || 0) + 1 }));
    if (proximidad >= encargo.umbral) {
      audio.playCorrect();
      const iterFinal = (iteraciones[encargo.idx] || 0) + 1;
      setRegistrosP4(prev => ({ ...prev, [`encargo_${encargo.idx}`]: { proximidad_final: proximidad, iteraciones: iterFinal } }));
      setPassedNotice({ idx: encargo.idx, prox: proximidad });
    } else {
      audio.playIncorrect();
      chooseHintForFailure();
    }
  }

  function onContinuarSiguiente() {
    setPassedNotice(null);
    setHint(null);
    setCommits(0);
    setDials({ c: 0, m: 0, y: 0 });
    if (encargo.idx === 1) { setEncargoIdx(2); setPhase(3); }
    else if (encargo.idx === 2) { setEncargoIdx(3); }
    else { setAllDone(true); }
  }

  const finalState = useMemo(() => ({
    equipo,
    registros_p3: initial.registros_p3,
    anomalia_p3: initial.anomalia_p3,
    registros_p4: registrosP4,
    ayudas_usadas: ayudasUsadas,
  }), [equipo, initial, registrosP4, ayudasUsadas]);

  const [copied, setCopied] = useState(false);
  function copyHandoffLink() {
    const url = window.location.origin + window.location.pathname + '?state=' + encodeState(finalState);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
    }
  }

  /* -------------------------------------------------------------------- */
  /* RENDER                                                                */
  /* -------------------------------------------------------------------- */

  if (!introDone) {
    return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-6' },
      React.createElement('div', { className: 'max-w-xl w-full border hairline bg-[var(--bg-panel)] p-6 sm:p-8' },
        React.createElement('svg', { viewBox: '0 0 400 140', className: 'w-full h-32 mb-5', 'aria-hidden': 'true' },
          React.createElement('rect', { x: 1, y: 1, width: 398, height: 138, fill: 'none', stroke: 'var(--line-blue-strong)', strokeWidth: 1 }),
          [{ x: 90, col: 'var(--cian)' }, { x: 200, col: 'var(--magenta)' }, { x: 310, col: 'var(--amarillo)' }].map((d, i) => React.createElement('g', { key: i },
            React.createElement('circle', { cx: d.x, cy: 78, r: 34, fill: 'none', stroke: d.col, strokeWidth: 2 }),
            React.createElement('line', { x1: d.x, y1: 78, x2: d.x, y2: 48, stroke: d.col, strokeWidth: 2 })
          )),
          React.createElement('rect', { x: 40, y: 14, width: 320, height: 22, fill: 'none', stroke: 'var(--ocre)', strokeWidth: 1.2, strokeDasharray: '3,2' }),
          React.createElement('text', { x: 50, y: 29, fill: 'var(--ocre)', fontSize: 11, fontFamily: 'monospace' }, 'MESA DE CALIBRACIÓN · DIALES C · M · Y')
        ),
        React.createElement('p', { className: 'mono t-title text-[var(--ocre)] mb-3' }, SYS_TITLE),
        React.createElement('p', { className: 't-body text-[var(--text-dim)] mb-6' }, SYS_INTRO),
        React.createElement('button', { className: 'mono t-body px-5 py-3 border scanline-btn text-[var(--text-main)]', onClick: () => setIntroDone(true) }, 'INICIAR CALIBRACIÓN →')
      )
    );
  }

  return React.createElement('div', { className: 'min-h-screen pb-24' },
    React.createElement(ConsoleHeader, { muted, onToggleMute: () => setMuted(m => !m), highContrast, onToggleContrast: () => setHighContrast(h => !h), equipo }),
    React.createElement(PhaseTracker, { phase }),
    React.createElement(WheelModal, { open: wheelModalOpen, onClose: () => setWheelModalOpen(false) }),
    React.createElement(HintBar, { text: hint, onDismiss: () => setHint(null) }),

    React.createElement('div', { className: 'max-w-4xl mx-auto px-4 sm:px-6 py-6' },

      React.createElement('div', { className: 'flex justify-end mb-4' },
        React.createElement('button', { className: 'mono t-body px-3 py-2 border hairline scanline-btn', onClick: () => setWheelModalOpen(true) }, '🎨 rueda de color')
      ),

      phase === 1 && React.createElement('div', null,
        React.createElement('p', { className: 'mono t-title text-[var(--text-main)] mb-5' }, 'IDENTIFICAR — rueda cromática'),
        React.createElement(WheelExplorer, null),
        React.createElement('div', { className: 'mt-8 flex justify-end' },
          React.createElement('button', { className: 'mono t-body font-semibold px-5 py-3 border scanline-btn', onClick: () => setPhase(2) }, 'CONTINUAR → FASE 2 · APLICAR')
        )
      ),

      (phase === 2 || phase === 3) && !allDone && React.createElement('div', null,
        React.createElement('div', { className: 'border border-[var(--ocre-dim)] bg-[var(--bg-panel)] px-4 py-4 mb-6' },
          React.createElement('p', { className: 't-body text-[var(--text-main)] font-semibold' }, encargo.texto)
        ),

        !passedNotice && React.createElement('div', null,
          React.createElement(ResultPanel, { encargo, resultRgb, proximidad }),
          React.createElement('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-6 my-8' },
            React.createElement(Dial, { label: 'Cian', colorVar: '--cian', value: dials.c, onChange: v => updateDial('c', v), audio }),
            React.createElement(Dial, { label: 'Magenta', colorVar: '--magenta', value: dials.m, onChange: v => updateDial('m', v), audio }),
            React.createElement(Dial, { label: 'Amarillo', colorVar: '--amarillo', value: dials.y, onChange: v => updateDial('y', v), audio }),
          ),
          React.createElement('div', { className: 'flex justify-end' },
            React.createElement('button', { className: 'mono t-body font-semibold px-5 py-3 border scanline-btn', onClick: onConfirmar }, 'CONFIRMAR MEZCLA')
          )
        ),

        passedNotice && React.createElement('div', { className: 'border hairline bg-[var(--bg-panel)] p-6 pulse-once' },
          React.createElement('p', { className: 'mono t-label text-[var(--ok)] mb-2' }, `ENCARGO ${passedNotice.idx} DE 3 · SUPERADO`),
          React.createElement('p', { className: 't-data text-[var(--text-main)] mb-5' }, `Coincidencia del ${passedNotice.prox}% — dentro del margen de tolerancia técnica.`),
          React.createElement('button', { className: 'mono t-body font-semibold px-5 py-3 border scanline-btn', onClick: onContinuarSiguiente },
            passedNotice.idx < 3 ? `CONTINUAR → ENCARGO ${passedNotice.idx + 1}` : 'CONTINUAR →')
        )
      ),

      allDone && React.createElement('div', { className: 'border hairline bg-[var(--bg-panel)] p-6' },
        React.createElement('p', { className: 'mono t-label text-[var(--gold)] mb-3' }, 'CRITERIO DE ÉXITO — SALA COMPLETA'),
        React.createElement('ul', { className: 't-body text-[var(--text-dim)] space-y-2 mb-5' },
          [1, 2, 3].map(i => React.createElement('li', { key: i },
            `✓ Encargo ${i}: proximidad final ${registrosP4[`encargo_${i}`] ? registrosP4[`encargo_${i}`].proximidad_final : '—'}% · ${registrosP4[`encargo_${i}`] ? registrosP4[`encargo_${i}`].iteraciones : '—'} intentos`
          ))
        ),
        React.createElement('button', { className: 'mono t-body font-semibold px-4 py-3 border scanline-btn', onClick: copyHandoffLink }, copied ? 'ENLACE COPIADO ✓' : '🔗 copiar enlace de estado → siguiente sala'),
        React.createElement('p', { className: 'mono t-body text-[var(--text-dim)] mt-3' }, 'El estado viaja codificado en el parámetro ?state= de la URL, sin localStorage.')
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
